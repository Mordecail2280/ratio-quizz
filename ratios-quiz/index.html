<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E7ECF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ratios">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Fichier ratios — quizz QCM</title>
<style>
  @font-face{
    font-family:'Fraunces';
    font-weight:400 600;
    font-style:normal;
    font-display:swap;
    src:url('fonts/Fraunces-var.woff2') format('woff2');
  }
  @font-face{
    font-family:'Public Sans';
    font-weight:400 600;
    font-style:normal;
    font-display:swap;
    src:url('fonts/PublicSans-var.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono';
    font-weight:400;
    font-style:normal;
    font-display:swap;
    src:url('fonts/IBMPlexMono-Regular.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono';
    font-weight:500;
    font-style:normal;
    font-display:swap;
    src:url('fonts/IBMPlexMono-Medium.woff2') format('woff2');
  }
</style>
<style>
  :root{
    --paper: #E7ECF0;
    --paper-line: #C9D3DB;
    --card: #FBFAF7;
    --ink: #1F2D4E;
    --ink-soft: #4B5A78;
    --red: #B5342B;
    --mustard: #B98A1F;
    --teal: #2E7D6B;
    --rust: #A85A22;
    --plum: #6B4C7A;
    --steel: #3D6B84;
    --cat-color: var(--ink);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{ overflow-x:hidden; }
  body{
    margin:0;
    overflow-x:hidden;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    display:flex;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ---------- side rail : category dividers ---------- */
  .rail{
    width:64px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    padding:28px 0;
    gap:2px;
    border-right:1px solid var(--paper-line);
  }
  .rail button{
    all:unset;
    cursor:pointer;
    touch-action:manipulation;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    padding:14px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    border-left:3px solid transparent;
    transition:color .15s, border-color .15s, background .15s;
  }
  .rail button:hover{ color:var(--ink); }
  .rail button.active{
    color:var(--card);
    background:var(--cat-color, var(--ink));
    border-left-color:var(--cat-color, var(--ink));
  }
  .rail button.all{ font-weight:600; }

  /* ---------- stage ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 24px 28px;
    min-width:0;
  }
  header.top{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:30px;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    margin:0;
  }
  header.top .subtitle{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  /* ---------- question card ---------- */
  .deck{
    position:relative;
    width:100%;
    max-width:560px;
  }
  .card-behind{
    position:absolute;
    inset:0;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:3px;
  }
  .card-behind-1{ transform:translate(6px,8px) rotate(1deg); }
  .card-behind-2{ transform:translate(11px,15px) rotate(1.8deg); opacity:.7; }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:3px;
    box-shadow:0 2px 1px rgba(31,45,78,.05);
    padding:28px 30px 26px;
  }

  .cat-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--card);
    background:var(--cat-color, var(--ink));
    padding:3px 8px;
    border-radius:2px;
    margin-bottom:16px;
  }

  .qtype{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .question{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(19px, 3.4vw, 24px);
    line-height:1.3;
    margin:0 0 22px;
  }
  .question .target{ color:var(--cat-color); }

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .opt{
    text-align:left;
    font-family:'Public Sans', sans-serif;
    font-size:13.5px;
    line-height:1.4;
    padding:12px 14px;
    min-height:44px;
    background:transparent;
    border:1px solid var(--paper-line);
    border-radius:2px;
    cursor:pointer;
    touch-action:manipulation;
    color:var(--ink);
    transition:border-color .12s, background .12s;
  }
  .opt .letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-right:6px;
  }
  .opt:hover:not(:disabled){ border-color:var(--cat-color); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--teal); background:rgba(46,125,107,.09); }
  .opt.wrong{ border-color:var(--red); background:rgba(181,52,43,.08); }
  .opt.dim{ opacity:.5; }

  .feedback{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--paper-line);
    display:none;
  }
  .feedback.show{ display:block; }
  .verdict{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.02em;
    margin:0 0 8px;
  }
  .verdict.ok{ color:var(--teal); }
  .verdict.ko{ color:var(--red); }
  .formula-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--red);
    background:rgba(181,52,43,.06);
    border:1px dashed rgba(181,52,43,.35);
    border-radius:2px;
    padding:8px 10px;
    margin:0 0 10px;
  }
  .expl{
    font-size:13.5px;
    line-height:1.55;
    margin:0 0 6px;
  }
  .expl.use{
    color:var(--ink-soft);
    font-style:italic;
  }
  .expl.use::before{ content:"→ "; font-style:normal; color:var(--cat-color); }

  .mini-cours{
    display:none;
    margin-top:14px;
    padding:16px 18px;
    background:rgba(185,138,31,.07);
    border-left:3px solid var(--mustard);
    border-radius:2px;
  }
  .mini-cours.show{ display:block; }
  .mini-cours .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--mustard);
    margin:0 0 14px;
  }
  .mc-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin:12px 0 4px;
  }
  .mc-sub:first-of-type{ margin-top:0; }
  .mini-cours .mc-sigle{
    font-size:12px;
    line-height:1.5;
    margin:0 0 6px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .mini-cours .mc-sigle:empty{ display:none; margin:0; }
  .mini-cours p.mc-text{
    font-size:13.5px;
    line-height:1.6;
    margin:0;
    color:var(--ink);
  }
  .mini-cours .formula-line{ margin:0; }
  .mini-cours p.mc-tip{
    font-size:13.5px;
    line-height:1.6;
    margin:0;
    color:var(--ink);
    padding-top:2px;
  }

  .nextbar{
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
  }
  #btnNext{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px 18px;
    min-height:44px;
    border-radius:2px;
    cursor:pointer;
    touch-action:manipulation;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--card);
  }
  #btnNext:hover{ background:#16223d; }

  .keyhint{
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    text-align:center;
    width:100%;
    max-width:560px;
  }

  footer.stats{
    margin-top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    gap:18px;
  }
  footer.stats b{ color:var(--ink); }

  @media (max-width:640px){
    .rail{
      width:100%;
      flex-direction:row;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      padding:10px 12px;
      border-right:none;
      border-bottom:1px solid var(--paper-line);
    }
    .rail button{ writing-mode:horizontal-tb; padding:9px 12px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .rail button.active{ border-bottom-color:var(--cat-color,var(--ink)); }
    body{ flex-direction:column; }
    .stage{ padding:20px 14px 24px; }
    header.top{ margin-bottom:22px; }
    .card-behind-1{ transform:translate(4px,5px) rotate(.6deg); }
    .card-behind-2{ transform:translate(7px,9px) rotate(1.1deg); }
    .card{ padding:20px 18px 20px; }
    .question{ margin:0 0 18px; }
    .options{ grid-template-columns:1fr; gap:8px; }
    .opt{ padding:13px 14px; font-size:14px; }
    .mini-cours{ padding:14px 14px; }
    .nextbar{ justify-content:stretch; }
    #btnNext{ width:100%; }
    .keyhint{ display:none; }
    footer.stats{
      flex-wrap:wrap;
      row-gap:6px;
      column-gap:14px;
      justify-content:center;
      text-align:center;
    }
  }

  @media (max-width:380px){
    header.top h1{ font-size:19px; }
    .question{ font-size:18px; }
    .card{ padding:16px 14px 18px; }
    .cat-tag{ font-size:10px; }
  }
</style>
</head>
<body>

  <nav class="rail" id="rail"></nav>

  <div class="stage">
    <header class="top">
      <div>
        <h1>Fichier ratios</h1>
        <div class="subtitle">quizz QCM continu — finance &amp; M&amp;A</div>
      </div>
    </header>

    <div class="deck">
      <div class="card-behind card-behind-2"></div>
      <div class="card-behind card-behind-1"></div>
      <div class="card">
        <span class="cat-tag" id="catTag"></span>
        <p class="qtype" id="qtype"></p>
        <h2 class="question" id="question"></h2>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback">
          <p class="verdict" id="verdict"></p>

          <div id="briefBlock">
            <div class="formula-line" id="formulaLine"></div>
            <p class="expl" id="explDef"></p>
            <p class="expl use" id="explUse"></p>
          </div>

          <div class="mini-cours" id="miniCours">
            <p class="label">📘 mini-cours — à apprendre</p>

            <p class="mc-sub">Définition</p>
            <p class="mc-sigle" id="mcSigle"></p>
            <p class="mc-text" id="mcDef"></p>

            <p class="mc-sub">Formule</p>
            <div class="formula-line" id="mcFormula"></div>

            <p class="mc-sub">Utilité</p>
            <p class="mc-text" id="mcUse"></p>

            <p class="mc-sub">À retenir</p>
            <p class="mc-tip" id="mcTip"></p>

            <p class="mc-sub">Exemple</p>
            <p class="mc-text" id="mcExemple"></p>
          </div>
        </div>

        <div class="nextbar">
          <button id="btnNext" hidden>suivant →</button>
        </div>
      </div>
    </div>

    <div class="keyhint">1-4 : répondre · entrée / espace : question suivante</div>

    <footer class="stats">
      <span>répondues : <b id="statVues">0</b></span>
      <span>bonnes : <b id="statOk">0</b></span>
      <span>à revoir : <b id="statKo">0</b></span>
    </footer>
  </div>

<script>
/* ---------------- data ---------------- */
const RATIOS = [
  {cat:"rentabilite", name:"Marge brute", formula:"(CA – Coût des ventes) / CA",
   def:"Part du chiffre d'affaires qui reste une fois payé le coût direct de production ou d'achat des biens vendus.",
   use:"Capacité à vendre au-dessus du coût de revient direct ; très surveillé en retail et en industrie.",
   cours:"Piège fréquent : oublier la main-d'œuvre directe dans les coûts variables, ce qui gonfle artificiellement la marge. Elle varie énormément selon le secteur (>60 % dans le luxe, <20 % dans la distribution) donc ne se compare qu'entre entreprises comparables.",
   exemple:"CA de 1 000 k€, coût des ventes de 650 k€ → marge brute = 350 / 1 000 = 35 %."},
  {cat:"rentabilite", name:"Marge d'EBITDA", formula:"EBITDA / CA",
   def:"Part du CA convertie en excédent brut d'exploitation, avant amortissements, intérêts et impôts.",
   use:"Rentabilité opérationnelle pure, indépendante du financement et des choix d'amortissement — ratio de référence en LBO.",
   cours:"Ne pas confondre avec la marge nette : l'EBITDA ignore volontairement amortissements, intérêts et impôts. Deux entreprises avec la même marge d'EBITDA peuvent avoir des résultats nets très différents selon leur dette et leurs investissements — c'est justement pour ça que ce ratio est le plus utilisé en comparables M&A.",
   exemple:"CA de 1 000 k€, EBITDA de 180 k€ → marge d'EBITDA = 18 %.",
   sigle:"EBITDA = Earnings Before Interest, Taxes, Depreciation and Amortization (l'excédent brut d'exploitation, en français)."},
  {cat:"rentabilite", name:"Marge opérationnelle (EBIT)", formula:"EBIT / CA",
   def:"Rentabilité de l'activité courante, après amortissements mais avant frais financiers et impôt sur les sociétés.",
   use:"Compare la performance opérationnelle d'entreprises ayant des structures de financement différentes.",
   cours:"Se situe entre la marge d'EBITDA et la marge nette : elle intègre les amortissements (donc la politique d'investissement) mais pas encore les intérêts ni l'impôt. Un grand écart entre marge EBITDA et marge EBIT signale une politique d'investissement lourde.",
   exemple:"CA de 1 000 k€, EBIT de 120 k€ → marge opérationnelle = 12 %.",
   sigle:"EBIT = Earnings Before Interest and Taxes (le résultat avant intérêts et impôts)."},
  {cat:"rentabilite", name:"Marge nette", formula:"Résultat net / CA",
   def:"Ce qu'il reste du chiffre d'affaires après toutes les charges, y compris financières et fiscales.",
   use:"Vision globale de la rentabilité, mais sensible aux éléments exceptionnels et à la structure de dette.",
   cours:"C'est la dernière ligne du compte de résultat — elle peut être polluée par des éléments exceptionnels (cession d'actif, provision) sans lien avec la performance récurrente. Toujours la lire avec le compte de résultat sous les yeux pour repérer ces éléments non-courants.",
   exemple:"CA de 1 000 k€, résultat net de 60 k€ → marge nette = 6 %."},
  {cat:"rentabilite", name:"ROE", formula:"Résultat net / Capitaux propres",
   def:"Rentabilité dégagée pour les actionnaires, rapportée aux capitaux propres qu'ils ont engagés.",
   use:"Ratio clé pour un actionnaire ; un ROE élevé peut aussi trahir un fort effet de levier, à croiser avec le gearing.",
   cours:"Piège classique : un ROE élevé peut simplement venir d'un fort endettement plutôt que d'une vraie performance opérationnelle. Toujours le croiser avec le ROA et le gearing avant de conclure qu'une entreprise est performante.",
   exemple:"Résultat net de 80 k€, capitaux propres de 400 k€ → ROE = 20 %.",
   sigle:"ROE = Return on Equity (rentabilité des capitaux propres)."},
  {cat:"rentabilite", name:"ROA", formula:"Résultat net / Total actif",
   def:"Rentabilité générée sur l'ensemble des actifs de l'entreprise, quel que soit leur mode de financement.",
   use:"Compare l'efficacité d'utilisation des actifs entre entreprises, indépendamment de leur structure capital/dette.",
   cours:"Contrairement au ROE, il n'est pas affecté par la structure de financement — c'est pour ça qu'il sert de base de comparaison neutre entre une entreprise très endettée et une autre qui ne l'est pas du tout.",
   exemple:"Résultat net de 80 k€, total actif de 1 200 k€ → ROA = 6,7 %.",
   sigle:"ROA = Return on Assets (rentabilité des actifs)."},
  {cat:"rentabilite", name:"ROCE / ROIC", formula:"EBIT × (1 – taux IS) / Capitaux investis",
   def:"Rentabilité opérationnelle après impôt, rapportée aux capitaux réellement engagés dans l'activité (dette nette + fonds propres).",
   use:"Ratio central pour juger si l'entreprise crée de la valeur au-delà de son coût du capital (à comparer au WACC).",
   cours:"Le ratio à comparer systématiquement au WACC : si ROIC > WACC, l'entreprise crée de la valeur ; si ROIC < WACC, elle en détruit, même avec un résultat net positif. C'est un ratio très regardé en private equity pour juger la qualité intrinsèque d'une cible.",
   exemple:"EBIT de 150 k€, IS à 25 %, capitaux investis de 900 k€ → ROIC = 150 × 0,75 / 900 = 12,5 %.",
   sigle:"ROCE = Return on Capital Employed ; ROIC = Return on Invested Capital (deux noms très proches pour la rentabilité des capitaux investis)."},

  {cat:"liquidite", name:"Ratio de liquidité générale", formula:"Actif circulant / Passif circulant",
   def:"Combien de fois les actifs mobilisables sous un an couvrent les dettes exigibles sous un an.",
   use:"Premier indicateur de risque de trésorerie à court terme ; en dessous de 1, signal d'alerte.",
   cours:"Un ratio élevé n'est pas toujours bon signe : cela peut aussi vouloir dire que l'entreprise dort sur des stocks ou des créances difficiles à transformer en cash. Il se lit toujours avec le quick ratio et le cash ratio pour affiner le diagnostic.",
   exemple:"Actif circulant 500 k€, passif circulant 350 k€ → current ratio = 1,43."},
  {cat:"liquidite", name:"Ratio de liquidité réduite (quick ratio)", formula:"(Actif circulant – Stocks) / Passif circulant",
   def:"Même logique que le current ratio, mais sans compter les stocks, souvent moins facilement liquides.",
   use:"Vision plus prudente de la liquidité, utile pour les activités aux stocks longs à écouler.",
   cours:"La différence avec le current ratio se joue sur les stocks : pour une entreprise industrielle avec des stocks lents à écouler, l'écart entre les deux ratios peut être important, et c'est précisément ce qu'il faut surveiller.",
   exemple:"Actif circulant 500 k€ dont 150 k€ de stocks, passif circulant 350 k€ → quick ratio = 350 / 350 = 1,0."},
  {cat:"liquidite", name:"Ratio de liquidité immédiate (cash ratio)", formula:"Trésorerie et équivalents / Passif circulant",
   def:"Part du passif à court terme que l'entreprise peut couvrir immédiatement avec sa seule trésorerie.",
   use:"Test de résistance extrême, particulièrement regardé en période de tension de crédit.",
   cours:"C'est le plus strict des trois ratios de liquidité — un cash ratio faible n'est pas forcément alarmant si l'entreprise dispose de lignes de crédit non tirées, à vérifier en annexe des comptes.",
   exemple:"Trésorerie 80 k€, passif circulant 350 k€ → cash ratio = 22,9 %."},

  {cat:"solvabilite", name:"Gearing (dette nette / fonds propres)", formula:"Dette financière nette / Capitaux propres",
   def:"Compare le financement par dette à celui par capitaux propres.",
   use:"Indicateur central de structure financière et de risque, très suivi en LBO/M&A pour juger la capacité d'endettement résiduelle.",
   cours:"Un gearing de 100 % (dette = capitaux propres) est souvent vu comme un repère central ; au-delà, l'entreprise est jugée plus risquée par les prêteurs, sauf secteurs à cash-flows très stables (infrastructures, immobilier).",
   exemple:"Dette nette 600 k€, capitaux propres 500 k€ → gearing = 120 %."},
  {cat:"solvabilite", name:"Dette nette / EBITDA", formula:"Dette financière nette / EBITDA",
   def:"Nombre d'années d'EBITDA nécessaires pour rembourser la dette financière.",
   use:"Ratio de levier le plus utilisé en financement d'acquisition ; sert souvent de covenant bancaire.",
   cours:"Le covenant bancaire classique pour une PME/ETI française tourne autour de 3x à 4x, et peut monter à 5-6x en LBO avec un EBITDA jugé solide. Toujours vérifier si l'EBITDA utilisé est ajusté ou brut, car cela peut fausser fortement la comparaison.",
   exemple:"Dette nette 900 k€, EBITDA 250 k€ → levier = 3,6x."},
  {cat:"solvabilite", name:"Ratio d'autonomie financière", formula:"Capitaux propres / Total bilan",
   def:"Part du bilan financée par les actionnaires plutôt que par des tiers.",
   use:"Mesure l'indépendance vis-à-vis des créanciers ; un seuil autour de 20-30 % est souvent surveillé par les banques.",
   cours:"À ne pas confondre avec le gearing : celui-ci rapporte les capitaux propres au total du bilan (pas aux seules dettes financières), donc il inclut aussi les dettes fournisseurs et autres passifs d'exploitation.",
   exemple:"Capitaux propres 500 k€, total bilan 1 500 k€ → autonomie financière = 33 %."},
  {cat:"solvabilite", name:"Couverture des intérêts", formula:"EBIT / Charges d'intérêts",
   def:"Nombre de fois que le résultat d'exploitation couvre la charge d'intérêts de la dette.",
   use:"Vérifie la marge de sécurité pour honorer les intérêts ; central en analyse crédit.",
   cours:"Un ratio inférieur à 1 signifie que l'EBIT ne suffit même pas à payer les intérêts — signal d'alerte fort pour un analyste crédit, souvent annonciateur de restructuration.",
   exemple:"EBIT 150 k€, charges d'intérêts 40 k€ → couverture = 3,75x."},
  {cat:"solvabilite", name:"DSCR", formula:"CAF disponible / Service de la dette (capital + intérêts)",
   def:"Capacité à couvrir, avec les flux de trésorerie disponibles, l'ensemble des échéances de dette de l'année.",
   use:"Ratio pivot en financement de projet et en LBO pour dimensionner la dette senior et fixer les covenants.",
   cours:"Se calcule sur une base prévisionnelle en financement de projet : un DSCR minimum (souvent 1,2x à 1,3x) est fixé contractuellement, et s'il passe en dessous, cela peut déclencher un cas de défaut technique (covenant breach) même si l'entreprise reste rentable.",
   exemple:"CAF disponible 200 k€, service de la dette (capital + intérêts) 150 k€ → DSCR = 1,33x.",

  {cat:"solvabilite", name:"Ratio de capacité de remboursement", formula:"Dette financière nette / CAF",

   sigle:"DSO = Days Sales Outstanding (délai de règlement clients, en jours)."},
  {cat:"activite", name:"DPO — délai fournisseurs", formula:"Dettes fournisseurs TTC / Achats TTC × 365",

  {cat:"activite", name:"Rotation des stocks (DIO)", formula:"Stocks / Coût d'achat des marchandises vendues × 365",

  {cat:"activite", name:"BFR en jours de CA", formula:"BFR / CA × 365",

  {cat:"activite", name:"Cycle de conversion de trésorerie", formula:"DSO + DIO – DPO",

];

const CATEGORIES = [
  {id:"rentabilite", label:"Rentabilité", color:"var(--mustard)"},
  {id:"liquidite", label:"Liquidité", color:"var(--teal)"},
  {id:"solvabilite", label:"Solvabilité", color:"var(--ink)"},
  {id:"activite", label:"Activité / BFR", color:"var(--rust)"},
  {id:"valorisation", label:"Valorisation", color:"var(--plum)"},
  {id:"dcf", label:"DCF", color:"var(--steel)"}
];
const catById = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));

const QUESTION_TYPES = [
  {id:"formula", label:"formule", ask:r=>`Quelle est la formule de « ${r.name} » ?`, key:"formula"},
  {id:"use",     label:"utilité", ask:r=>`À quoi sert principalement le ratio « ${r.name} » ?`, key:"use"},
  {id:"name",    label:"identification", ask:r=>`Quel ratio correspond à la formule suivante ?<br><span class="target">${r.formula}</span>`, key:"name"}
];

/* ---------------- state (persisted) ---------------- */
const STORAGE_KEY = "ratios-quiz-qcm-v1";
let weights = {};
let stats = {vues:0, ok:0, ko:0};
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  weights = saved.weights || {};
  stats = saved.stats || stats;
}catch(e){}
RATIOS.forEach(r=>{ if(!(r.name in weights)) weights[r.name]=3; });

let activeCat = null;
let current = null;      // ratio at the heart of the question
let qtype = null;
let lastName = null;
let answered = false;

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({weights, stats}));
}

/* ---------------- pool / draw ---------------- */
function pool(){
  return activeCat ? RATIOS.filter(r=>r.cat===activeCat) : RATIOS;
}
function pickTarget(){
  const p = pool().filter(r=>r.name!==lastName || pool().length===1);
  const total = p.reduce((s,r)=>s+weights[r.name],0);
  let x = Math.random()*total;
  for(const r of p){
    x -= weights[r.name];
    if(x<=0) return r;
  }
  return p[p.length-1];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickDistractors(correct, key, n){
  const samePool = pool().filter(r=>r!==correct);
  const globalPool = RATIOS.filter(r=>r!==correct);
  const seen = new Set([correct[key]]);
  const out = [];
  for(const r of shuffle(samePool)){
    if(out.length>=n) break;
    if(!seen.has(r[key])){ seen.add(r[key]); out.push(r[key]); }
  }
  if(out.length<n){
    for(const r of shuffle(globalPool)){
      if(out.length>=n) break;
      if(!seen.has(r[key])){ seen.add(r[key]); out.push(r[key]); }
    }
  }
  return out;
}

/* ---------------- render ---------------- */
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const btnNext = document.getElementById("btnNext");

function setCatColor(catId){
  document.documentElement.style.setProperty("--cat-color", catById[catId].color);
}

let correctText = null;

function renderQuestion(){
  answered = false;
  const r = pickTarget();
  lastName = r.name;
  current = r;
  qtype = QUESTION_TYPES[Math.floor(Math.random()*QUESTION_TYPES.length)];

  setCatColor(r.cat);
  document.getElementById("catTag").textContent = catById[r.cat].label;
  document.getElementById("qtype").textContent = "question — " + qtype.label;
  document.getElementById("question").innerHTML = qtype.ask(r);

  correctText = r[qtype.key];
  const distractors = pickDistractors(r, qtype.key, 3);
  const opts = shuffle([correctText, ...distractors]);
  const letters = ["A","B","C","D"];

  optionsEl.innerHTML = "";
  opts.forEach((text, i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">${letters[i]}</span>${text}`;
    b.dataset.correct = (text===correctText) ? "1" : "0";
    b.onclick = ()=>selectAnswer(b);
    optionsEl.appendChild(b);
  });

  feedbackEl.classList.remove("show");
  btnNext.hidden = true;
}

function selectAnswer(btn){
  if(answered) return;
  answered = true;
  const knew = btn.dataset.correct==="1";

  [...optionsEl.children].forEach(o=>{
    o.disabled = true;
    if(o.dataset.correct==="1") o.classList.add("correct");
    else if(o===btn) o.classList.add("wrong");
    else o.classList.add("dim");
  });

  const w = weights[current.name];
  stats.vues++;
  if(knew){
    weights[current.name] = Math.max(1, w-1);
    stats.ok++;
  }else{
    weights[current.name] = Math.min(12, w+3);
    stats.ko++;
  }
  persist();
  updateStats();

  document.getElementById("verdict").textContent = knew ? "✓ exact." : "✗ pas tout à fait — à revoir.";
  document.getElementById("verdict").className = "verdict " + (knew?"ok":"ko");

  const briefBlock = document.getElementById("briefBlock");
  const miniCours = document.getElementById("miniCours");

  if(knew){
    document.getElementById("formulaLine").textContent = current.formula;
    document.getElementById("explDef").textContent = current.def;
    document.getElementById("explUse").textContent = current.use;
    briefBlock.hidden = false;
    miniCours.classList.remove("show");
  }else{
    document.getElementById("mcSigle").textContent = current.sigle || "";
    document.getElementById("mcDef").textContent = current.def;
    document.getElementById("mcFormula").textContent = current.formula;
    document.getElementById("mcUse").textContent = current.use;
    document.getElementById("mcTip").textContent = current.cours;
    document.getElementById("mcExemple").textContent = current.exemple || "—";
    briefBlock.hidden = true;
    miniCours.classList.add("show");
  }

  feedbackEl.classList.add("show");
  btnNext.hidden = false;
}

function updateStats(){
  document.getElementById("statVues").textContent = stats.vues;
  document.getElementById("statOk").textContent = stats.ok;
  document.getElementById("statKo").textContent = stats.ko;
}

/* ---------------- rail ---------------- */
const railEl = document.getElementById("rail");
function buildRail(){
  railEl.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.textContent = "Tout";
  allBtn.className = "all" + (activeCat===null ? " active":"");
  allBtn.style.setProperty("--cat-color","var(--ink)");
  allBtn.onclick = ()=>{ activeCat=null; buildRail(); renderQuestion(); };
  railEl.appendChild(allBtn);

  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c.label;
    b.style.setProperty("--cat-color", c.color);
    if(activeCat===c.id) b.classList.add("active");
    b.onclick = ()=>{ activeCat = (activeCat===c.id) ? null : c.id; buildRail(); renderQuestion(); };
    railEl.appendChild(b);
  });
}

/* ---------------- events ---------------- */
btnNext.addEventListener("click", renderQuestion);

document.addEventListener("keydown", (e)=>{
  if(!answered && ["1","2","3","4"].includes(e.key)){
    const idx = parseInt(e.key,10)-1;
    const btn = optionsEl.children[idx];
    if(btn) selectAnswer(btn);
  } else if(answered && (e.code==="Enter" || e.code==="Space")){
    e.preventDefault();
    renderQuestion();
  }
});

/* ---------------- init ---------------- */
buildRail();
updateStats();
renderQuestion();

/* ---------------- offline (PWA) ---------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
