<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E7ECF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ratios">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Fichier ratios — quizz QCM</title>
<style>
  @font-face{
    font-family:'Fraunces';
    font-weight:400 600;
    font-style:normal;
    font-display:swap;
    src:url('fonts/Fraunces-var.woff2') format('woff2');
  }
  @font-face{
    font-family:'Public Sans';
    font-weight:400 600;
    font-style:normal;
    font-display:swap;
    src:url('fonts/PublicSans-var.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono';
    font-weight:400;
    font-style:normal;
    font-display:swap;
    src:url('fonts/IBMPlexMono-Regular.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono';
    font-weight:500;
    font-style:normal;
    font-display:swap;
    src:url('fonts/IBMPlexMono-Medium.woff2') format('woff2');
  }
</style>
<style>
  :root{
    --paper: #E7ECF0;
    --paper-line: #C9D3DB;
    --card: #FBFAF7;
    --ink: #1F2D4E;
    --ink-soft: #4B5A78;
    --red: #B5342B;
    --mustard: #B98A1F;
    --teal: #2E7D6B;
    --rust: #A85A22;
    --plum: #6B4C7A;
    --steel: #3D6B84;
    --cat-color: var(--ink);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{ overflow-x:hidden; }
  body{
    margin:0;
    overflow-x:hidden;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    display:flex;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ---------- side rail : category dividers ---------- */
  .rail{
    width:64px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    padding:28px 0;
    gap:2px;
    border-right:1px solid var(--paper-line);
  }
  .rail button{
    all:unset;
    cursor:pointer;
    touch-action:manipulation;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    padding:14px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    border-left:3px solid transparent;
    transition:color .15s, border-color .15s, background .15s;
  }
  .rail button:hover{ color:var(--ink); }
  .rail button.active{
    color:var(--card);
    background:var(--cat-color, var(--ink));
    border-left-color:var(--cat-color, var(--ink));
  }
  .rail button.all{ font-weight:600; }

  /* ---------- stage ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 24px 28px;
    min-width:0;
  }
  header.top{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:30px;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    margin:0;
  }
  header.top .subtitle{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  /* ---------- question card ---------- */
  .deck{
    position:relative;
    width:100%;
    max-width:560px;
  }
  .card-behind{
    position:absolute;
    inset:0;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:3px;
  }
  .card-behind-1{ transform:translate(6px,8px) rotate(1deg); }
  .card-behind-2{ transform:translate(11px,15px) rotate(1.8deg); opacity:.7; }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:3px;
    box-shadow:0 2px 1px rgba(31,45,78,.05);
    padding:28px 30px 26px;
  }

  .cat-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--card);
    background:var(--cat-color, var(--ink));
    padding:3px 8px;
    border-radius:2px;
    margin-bottom:16px;
  }

  .qtype{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .question{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(19px, 3.4vw, 24px);
    line-height:1.3;
    margin:0 0 22px;
  }
  .question .target{ color:var(--cat-color); }

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .opt{
    text-align:left;
    font-family:'Public Sans', sans-serif;
    font-size:13.5px;
    line-height:1.4;
    padding:12px 14px;
    min-height:44px;
    background:transparent;
    border:1px solid var(--paper-line);
    border-radius:2px;
    cursor:pointer;
    touch-action:manipulation;
    color:var(--ink);
    transition:border-color .12s, background .12s;
  }
  .opt .letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-right:6px;
  }
  .opt:hover:not(:disabled){ border-color:var(--cat-color); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color:var(--teal); background:rgba(46,125,107,.09); }
  .opt.wrong{ border-color:var(--red); background:rgba(181,52,43,.08); }
  .opt.dim{ opacity:.5; }

  .feedback{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--paper-line);
    display:none;
  }
  .feedback.show{ display:block; }
  .verdict{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.02em;
    margin:0 0 8px;
  }
  .verdict.ok{ color:var(--teal); }
  .verdict.ko{ color:var(--red); }
  .formula-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--red);
    background:rgba(181,52,43,.06);
    border:1px dashed rgba(181,52,43,.35);
    border-radius:2px;
    padding:8px 10px;
    margin:0 0 10px;
  }
  .expl{
    font-size:13.5px;
    line-height:1.55;
    margin:0 0 6px;
  }
  .expl.use{
    color:var(--ink-soft);
    font-style:italic;
  }
  .expl.use::before{ content:"→ "; font-style:normal; color:var(--cat-color); }

  .mini-cours{
    display:none;
    margin-top:14px;
    padding:16px 18px;
    background:rgba(185,138,31,.07);
    border-left:3px solid var(--mustard);
    border-radius:2px;
  }
  .mini-cours.show{ display:block; }
  .mini-cours .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    color:var(--mustard);
    margin:0 0 14px;
  }
  .mc-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin:12px 0 4px;
  }
  .mc-sub:first-of-type{ margin-top:0; }
  .mini-cours .mc-sigle{
    font-size:12px;
    line-height:1.5;
    margin:0 0 6px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .mini-cours .mc-sigle:empty{ display:none; margin:0; }
  .mini-cours p.mc-text{
    font-size:13.5px;
    line-height:1.6;
    margin:0;
    color:var(--ink);
  }
  .mini-cours .formula-line{ margin:0; }
  .mini-cours p.mc-tip{
    font-size:13.5px;
    line-height:1.6;
    margin:0;
    color:var(--ink);
    padding-top:2px;
  }

  .nextbar{
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
  }
  #btnNext{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px 18px;
    min-height:44px;
    border-radius:2px;
    cursor:pointer;
    touch-action:manipulation;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--card);
  }
  #btnNext:hover{ background:#16223d; }

  .keyhint{
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    text-align:center;
    width:100%;
    max-width:560px;
  }

  footer.stats{
    margin-top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    gap:18px;
  }
  footer.stats b{ color:var(--ink); }

  .popup-overlay{
    position:fixed;
    inset:0;
    background:rgba(31,45,78,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
  }
  .popup-overlay.show{ display:flex; }
  .popup-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:30px 26px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 12px 32px rgba(31,45,78,.28);
  }
  .popup-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 16px;
  }
  .popup-score{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:46px;
    color:var(--ink);
    margin:0 0 6px;
  }
  .popup-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 24px;
  }
  #popupClose{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px 18px;
    min-height:44px;
    width:100%;
    border-radius:2px;
    cursor:pointer;
    touch-action:manipulation;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--card);
  }
  #popupClose:hover{ background:#16223d; }

  @media (max-width:640px){
    .rail{
      width:100%;
      flex-direction:row;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      padding:10px 12px;
      border-right:none;
      border-bottom:1px solid var(--paper-line);
    }
    .rail button{ writing-mode:horizontal-tb; padding:9px 12px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .rail button.active{ border-bottom-color:var(--cat-color,var(--ink)); }
    body{ flex-direction:column; }
    .stage{ padding:20px 14px 24px; }
    header.top{ margin-bottom:22px; }
    .card-behind-1{ transform:translate(4px,5px) rotate(.6deg); }
    .card-behind-2{ transform:translate(7px,9px) rotate(1.1deg); }
    .card{ padding:20px 18px 20px; }
    .question{ margin:0 0 18px; }
    .options{ grid-template-columns:1fr; gap:8px; }
    .opt{ padding:13px 14px; font-size:14px; }
    .mini-cours{ padding:14px 14px; }
    .nextbar{ justify-content:stretch; }
    #btnNext{ width:100%; }
    .keyhint{ display:none; }
    footer.stats{
      flex-wrap:wrap;
      row-gap:6px;
      column-gap:14px;
      justify-content:center;
      text-align:center;
    }
  }

  @media (max-width:380px){
    header.top h1{ font-size:19px; }
    .question{ font-size:18px; }
    .card{ padding:16px 14px 18px; }
    .cat-tag{ font-size:10px; }
  }
</style>
</head>
<body>

  <nav class="rail" id="rail"></nav>

  <div class="stage">
    <header class="top">
      <div>
        <h1>Fichier ratios</h1>
        <div class="subtitle">quizz QCM continu — finance &amp; M&amp;A</div>
      </div>
    </header>

    <div class="deck">
      <div class="card-behind card-behind-2"></div>
      <div class="card-behind card-behind-1"></div>
      <div class="card">
        <span class="cat-tag" id="catTag"></span>
        <p class="qtype" id="qtype"></p>
        <h2 class="question" id="question"></h2>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback">
          <p class="verdict" id="verdict"></p>

          <div id="briefBlock">
            <div class="formula-line" id="formulaLine"></div>
            <p class="expl" id="explDef"></p>
            <p class="expl use" id="explUse"></p>
          </div>

          <div class="mini-cours" id="miniCours">
            <p class="label">📘 mini-cours — à apprendre</p>

            <p class="mc-sub">Définition</p>
            <p class="mc-sigle" id="mcSigle"></p>
            <p class="mc-text" id="mcDef"></p>

            <p class="mc-sub">Formule</p>
            <div class="formula-line" id="mcFormula"></div>

            <p class="mc-sub">Utilité</p>
            <p class="mc-text" id="mcUse"></p>

            <p class="mc-sub">À retenir</p>
            <p class="mc-tip" id="mcTip"></p>

            <p class="mc-sub">Exemple</p>
            <p class="mc-text" id="mcExemple"></p>
          </div>
        </div>

        <div class="nextbar">
          <button id="btnNext" hidden>suivant →</button>
        </div>
      </div>
    </div>

    <div class="keyhint">1-4 : répondre · entrée / espace : question suivante</div>

    <footer class="stats">
      <span>Score : <b id="scorePct">0%</b></span>
    </footer>
  </div>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-card">
      <p class="popup-label">📊 bilan des 100 dernières questions</p>
      <p class="popup-score" id="popupScore">0%</p>
      <p class="popup-sub" id="popupSub">0 bonnes réponses sur 100</p>
      <button id="popupClose">Continuer</button>
    </div>
  </div>

<script>
/* ---------------- data ---------------- */
const RATIOS = [
  {cat:"rentabilite", name:"Marge brute", formula:"(CA – Coût des ventes) / CA",
   def:"Part du chiffre d'affaires qui reste une fois payé le coût direct de production ou d'achat des biens vendus.",
   use:"mesurer la capacité à vendre au-dessus du coût de revient direct ; très surveillé en retail et en industrie.",
   cours:"Piège fréquent : oublier la main-d'œuvre directe dans les coûts variables, ce qui gonfle artificiellement la marge. Elle varie énormément selon le secteur (>60 % dans le luxe, <20 % dans la distribution) donc ne se compare qu'entre entreprises comparables.",
   exemple:"CA de 1 000 k€, coût des ventes de 650 k€ → marge brute = 350 / 1 000 = 35 %."},
  {cat:"rentabilite", name:"Marge d'EBITDA", formula:"EBITDA / CA",
   def:"Part du CA convertie en excédent brut d'exploitation, avant amortissements, intérêts et impôts.",
   use:"évaluer la rentabilité opérationnelle pure, indépendante du financement et des choix d'amortissement — ratio de référence en LBO.",
   cours:"Ne pas confondre avec la marge nette : l'EBITDA ignore volontairement amortissements, intérêts et impôts. Deux entreprises avec la même marge d'EBITDA peuvent avoir des résultats nets très différents selon leur dette et leurs investissements — c'est justement pour ça que ce ratio est le plus utilisé en comparables M&A.",
   exemple:"CA de 1 000 k€, EBITDA de 180 k€ → marge d'EBITDA = 18 %.",
   sigle:"EBITDA = Earnings Before Interest, Taxes, Depreciation and Amortization (l'excédent brut d'exploitation, en français)."},
  {cat:"rentabilite", name:"Marge opérationnelle (EBIT)", formula:"EBIT / CA",
   def:"Rentabilité de l'activité courante, après amortissements mais avant frais financiers et impôt sur les sociétés.",
   use:"comparer la performance opérationnelle d'entreprises ayant des structures de financement différentes.",
   cours:"Se situe entre la marge d'EBITDA et la marge nette : elle intègre les amortissements (donc la politique d'investissement) mais pas encore les intérêts ni l'impôt. Un grand écart entre marge EBITDA et marge EBIT signale une politique d'investissement lourde.",
   exemple:"CA de 1 000 k€, EBIT de 120 k€ → marge opérationnelle = 12 %.",
   sigle:"EBIT = Earnings Before Interest and Taxes (le résultat avant intérêts et impôts)."},
  {cat:"rentabilite", name:"Marge nette", formula:"Résultat net / CA",
   def:"Ce qu'il reste du chiffre d'affaires après toutes les charges, y compris financières et fiscales.",
   use:"donner une vision globale de la rentabilité, à nuancer des éléments exceptionnels et de la structure de dette.",
   cours:"C'est la dernière ligne du compte de résultat — elle peut être polluée par des éléments exceptionnels (cession d'actif, provision) sans lien avec la performance récurrente. Toujours la lire avec le compte de résultat sous les yeux pour repérer ces éléments non-courants.",
   exemple:"CA de 1 000 k€, résultat net de 60 k€ → marge nette = 6 %."},
  {cat:"rentabilite", name:"ROE", formula:"Résultat net / Capitaux propres",
   def:"Rentabilité dégagée pour les actionnaires, rapportée aux capitaux propres qu'ils ont engagés.",
   use:"évaluer la rentabilité pour l'actionnaire, à croiser avec le ROA et le gearing pour vérifier qu'elle ne vient pas seulement du levier.",
   cours:"Piège classique : un ROE élevé peut simplement venir d'un fort endettement plutôt que d'une vraie performance opérationnelle. Toujours le croiser avec le ROA et le gearing avant de conclure qu'une entreprise est performante.",
   exemple:"Résultat net de 80 k€, capitaux propres de 400 k€ → ROE = 20 %.",
   sigle:"ROE = Return on Equity (rentabilité des capitaux propres)."},
  {cat:"rentabilite", name:"ROA", formula:"Résultat net / Total actif",
   def:"Rentabilité générée sur l'ensemble des actifs de l'entreprise, quel que soit leur mode de financement.",
   use:"comparer l'efficacité d'utilisation des actifs entre entreprises, indépendamment de leur structure capital/dette.",
   cours:"Contrairement au ROE, il n'est pas affecté par la structure de financement — c'est pour ça qu'il sert de base de comparaison neutre entre une entreprise très endettée et une autre qui ne l'est pas du tout.",
   exemple:"Résultat net de 80 k€, total actif de 1 200 k€ → ROA = 6,7 %.",
   sigle:"ROA = Return on Assets (rentabilité des actifs)."},
  {cat:"rentabilite", name:"ROCE / ROIC", formula:"EBIT × (1 – taux IS) / Capitaux investis",
   def:"Rentabilité opérationnelle après impôt, rapportée aux capitaux réellement engagés dans l'activité (dette nette + fonds propres).",
   use:"juger si l'entreprise crée de la valeur au-delà de son coût du capital, en comparant au WACC.",
   cours:"Le ratio à comparer systématiquement au WACC : si ROIC > WACC, l'entreprise crée de la valeur ; si ROIC < WACC, elle en détruit, même avec un résultat net positif. C'est un ratio très regardé en private equity pour juger la qualité intrinsèque d'une cible.",
   exemple:"EBIT de 150 k€, IS à 25 %, capitaux investis de 900 k€ → ROIC = 150 × 0,75 / 900 = 12,5 %.",
   sigle:"ROCE = Return on Capital Employed ; ROIC = Return on Invested Capital (deux noms très proches pour la rentabilité des capitaux investis)."},

  {cat:"liquidite", name:"Ratio de liquidité générale", formula:"Actif circulant / Passif circulant",
   def:"Combien de fois les actifs mobilisables sous un an couvrent les dettes exigibles sous un an.",
   use:"évaluer le risque de trésorerie à court terme ; en dessous de 1, signal d'alerte.",
   cours:"Un ratio élevé n'est pas toujours bon signe : cela peut aussi vouloir dire que l'entreprise dort sur des stocks ou des créances difficiles à transformer en cash. Il se lit toujours avec le quick ratio et le cash ratio pour affiner le diagnostic.",
   exemple:"Actif circulant 500 k€, passif circulant 350 k€ → current ratio = 1,43."},
  {cat:"liquidite", name:"Ratio de liquidité réduite (quick ratio)", formula:"(Actif circulant – Stocks) / Passif circulant",
   def:"Même logique que le current ratio, mais sans compter les stocks, souvent moins facilement liquides.",
   use:"affiner la liquidité générale en excluant les stocks, souvent moins facilement liquides.",
   cours:"La différence avec le current ratio se joue sur les stocks : pour une entreprise industrielle avec des stocks lents à écouler, l'écart entre les deux ratios peut être important, et c'est précisément ce qu'il faut surveiller.",
   exemple:"Actif circulant 500 k€ dont 150 k€ de stocks, passif circulant 350 k€ → quick ratio = 350 / 350 = 1,0."},
  {cat:"liquidite", name:"Ratio de liquidité immédiate (cash ratio)", formula:"Trésorerie et équivalents / Passif circulant",
   def:"Part du passif à court terme que l'entreprise peut couvrir immédiatement avec sa seule trésorerie.",
   use:"tester la résistance extrême de la trésorerie, particulièrement regardé en période de tension de crédit.",
   cours:"C'est le plus strict des trois ratios de liquidité — un cash ratio faible n'est pas forcément alarmant si l'entreprise dispose de lignes de crédit non tirées, à vérifier en annexe des comptes.",
   exemple:"Trésorerie 80 k€, passif circulant 350 k€ → cash ratio = 22,9 %."},

  {cat:"solvabilite", name:"Gearing (dette nette / fonds propres)", formula:"Dette financière nette / Capitaux propres",
   def:"Compare le financement par dette à celui par capitaux propres.",
   use:"juger le niveau de risque financier ; très suivi en LBO/M&A pour évaluer la capacité d'endettement résiduelle.",
   cours:"Un gearing de 100 % (dette = capitaux propres) est souvent vu comme un repère central ; au-delà, l'entreprise est jugée plus risquée par les prêteurs, sauf secteurs à cash-flows très stables (infrastructures, immobilier).",
   exemple:"Dette nette 600 k€, capitaux propres 500 k€ → gearing = 120 %."},
  {cat:"solvabilite", name:"Dette nette / EBITDA", formula:"Dette financière nette / EBITDA",
   def:"Nombre d'années d'EBITDA nécessaires pour rembourser la dette financière.",
   use:"mesurer le niveau de levier ; sert souvent de covenant bancaire en financement d'acquisition.",
   cours:"Le covenant bancaire classique pour une PME/ETI française tourne autour de 3x à 4x, et peut monter à 5-6x en LBO avec un EBITDA jugé solide. Toujours vérifier si l'EBITDA utilisé est ajusté ou brut, car cela peut fausser fortement la comparaison.",
   exemple:"Dette nette 900 k€, EBITDA 250 k€ → levier = 3,6x."},
  {cat:"solvabilite", name:"Ratio d'autonomie financière", formula:"Capitaux propres / Total bilan",
   def:"Part du bilan financée par les actionnaires plutôt que par des tiers.",
   use:"mesurer l'indépendance vis-à-vis des créanciers ; un seuil autour de 20-30 % est souvent surveillé par les banques.",
   cours:"À ne pas confondre avec le gearing : celui-ci rapporte les capitaux propres au total du bilan (pas aux seules dettes financières), donc il inclut aussi les dettes fournisseurs et autres passifs d'exploitation.",
   exemple:"Capitaux propres 500 k€, total bilan 1 500 k€ → autonomie financière = 33 %."},
  {cat:"solvabilite", name:"Couverture des intérêts", formula:"EBIT / Charges d'intérêts",
   def:"Nombre de fois que le résultat d'exploitation couvre la charge d'intérêts de la dette.",
   use:"vérifier la marge de sécurité pour honorer les intérêts de la dette ; central en analyse crédit.",
   cours:"Un ratio inférieur à 1 signifie que l'EBIT ne suffit même pas à payer les intérêts — signal d'alerte fort pour un analyste crédit, souvent annonciateur de restructuration.",
   exemple:"EBIT 150 k€, charges d'intérêts 40 k€ → couverture = 3,75x."},
  {cat:"solvabilite", name:"DSCR", formula:"CAF disponible / Service de la dette (capital + intérêts)",
   def:"Capacité à couvrir, avec les flux de trésorerie disponibles, l'ensemble des échéances de dette de l'année.",
   use:"dimensionner la dette senior et fixer les covenants en financement de projet et en LBO.",
   cours:"Se calcule sur une base prévisionnelle en financement de projet : un DSCR minimum (souvent 1,2x à 1,3x) est fixé contractuellement, et s'il passe en dessous, cela peut déclencher un cas de défaut technique (covenant breach) même si l'entreprise reste rentable.",
   exemple:"CAF disponible 200 k€, service de la dette (capital + intérêts) 150 k€ → DSCR = 1,33x.",
   sigle:"DSCR = Debt Service Coverage Ratio (ratio de couverture du service de la dette)."},
  {cat:"solvabilite", name:"Ratio de capacité de remboursement", formula:"Dette financière nette / CAF",
   def:"Nombre d'années de capacité d'autofinancement nécessaires pour rembourser la dette.",
   use:"juger la soutenabilité de la dette dans la durée ; très utilisé côté banque et crédit PME.",
   cours:"Repère classique côté banque PME : au-delà de 3 à 4 ans de CAF pour rembourser la dette, le dossier de financement devient plus difficile à faire accepter en comité de crédit.",
   exemple:"Dette nette 900 k€, CAF 250 k€ → 3,6 ans de CAF pour rembourser la dette."},

  {cat:"activite", name:"DSO (délai clients)", formula:"Créances clients TTC / CA TTC × 365",
   def:"Délai moyen, en jours, mis par les clients pour payer l'entreprise.",
   use:"surveiller le risque de recouvrement client et l'évolution du BFR.",
   cours:"Un DSO qui grimpe progressivement sur plusieurs trimestres est souvent un signal avant-coureur de difficultés chez les clients, ou d'un relâchement du recouvrement — à surveiller de près en analyse crédit.",
   exemple:"Créances clients 200 k€, CA TTC 1 800 k€ → DSO = 200 / 1 800 × 365 ≈ 41 jours.",
   sigle:"DSO = Days Sales Outstanding (délai de règlement clients, en jours)."},
  {cat:"activite", name:"DPO (délai fournisseurs)", formula:"Dettes fournisseurs TTC / Achats TTC × 365",
   def:"Délai moyen, en jours, que l'entreprise met à payer ses fournisseurs.",
   use:"évaluer la négociation avec les fournisseurs et son effet sur le BFR.",
   cours:"Un DPO anormalement élevé par rapport au secteur peut aussi être un signal négatif : cela peut signifier que l'entreprise retarde ses paiements faute de trésorerie plutôt que par simple négociation commerciale.",
   exemple:"Dettes fournisseurs 150 k€, achats TTC 900 k€ → DPO = 150 / 900 × 365 ≈ 61 jours.",
   sigle:"DPO = Days Payable Outstanding (délai de règlement fournisseurs, en jours)."},
  {cat:"activite", name:"Rotation des stocks (DIO)", formula:"Stocks / Coût d'achat des marchandises vendues × 365",
   def:"Nombre de jours moyen que les marchandises restent en stock avant d'être vendues.",
   use:"repérer des stocks dormants qui immobilisent de la trésorerie.",
   cours:"Se lit toujours en tendance plutôt qu'en absolu, car le niveau normal varie énormément selon le secteur (quasi nul dans les services, plusieurs mois dans le luxe ou l'aéronautique).",
   exemple:"Stocks 120 k€, coût d'achat 720 k€ → DIO = 120 / 720 × 365 ≈ 61 jours.",
   sigle:"DIO = Days Inventory Outstanding (durée de rotation des stocks, en jours)."},
  {cat:"activite", name:"BFR en jours de CA", formula:"BFR / CA × 365",
   def:"Exprime le besoin en fonds de roulement en nombre de jours de chiffre d'affaires plutôt qu'en valeur absolue.",
   use:"comparer le BFR d'entreprises de tailles différentes et suivre sa dérive dans le temps.",
   cours:"Un BFR négatif (l'entreprise est payée par ses clients avant de payer ses fournisseurs) est très recherché en LBO car il finance une partie de la croissance sans capital supplémentaire — typiquement le cas de la grande distribution.",
   exemple:"BFR 180 k€, CA 1 000 k€ → BFR = 180 / 1 000 × 365 ≈ 66 jours de CA.",
   sigle:"BFR = Besoin en Fonds de Roulement."},
  {cat:"activite", name:"Taux de rotation de l'actif", formula:"CA / Total actif",
   def:"Chiffre d'affaires généré pour chaque euro d'actif détenu par l'entreprise.",
   use:"mesurer l'intensité capitalistique de l'activité ; utile pour comparer un modèle de services à un modèle industriel.",
   cours:"Se combine avec la marge nette dans la décomposition DuPont du ROE : ROE = marge nette × rotation de l'actif × levier financier, une façon classique de décortiquer d'où vient la rentabilité d'une entreprise.",
   exemple:"CA 1 000 k€, total actif 800 k€ → rotation = 1,25x."},
  {cat:"activite", name:"Cycle de conversion de trésorerie", formula:"DSO + DIO – DPO",
   def:"Nombre de jours entre le décaissement pour produire ou acheter et l'encaissement du client, crédit fournisseur déduit.",
   use:"évaluer combien de temps l'activité consomme de la trésorerie pour tourner.",
   cours:"Peut être négatif pour certains modèles économiques (grande distribution, marketplaces) : l'entreprise encaisse ses clients avant de payer ses fournisseurs, ce qui génère du cash plutôt que d'en consommer en grandissant.",
   exemple:"DSO 41 j + DIO 61 j – DPO 61 j = 41 jours de cash immobilisé par le cycle d'exploitation."},

  {cat:"valorisation", name:"EV/EBITDA", formula:"Valeur d'entreprise / EBITDA",
   def:"Multiple qui rapporte la valeur globale de l'entreprise, dette incluse, à sa rentabilité opérationnelle.",
   use:"comparer des cibles en neutralisant les différences de structure financière et de fiscalité ; multiple de référence en M&A.",
   cours:"Toujours vérifier ce qui est inclus dans la dette de la valeur d'entreprise (dette financière, mais aussi parfois leasing, engagements de retraite, earn-out) car cela peut faire varier significativement le multiple affiché.",
   exemple:"Valeur d'entreprise 1 200 k€, EBITDA 200 k€ → multiple = 6,0x.",
   sigle:"EV = Enterprise Value (valeur d'entreprise) ; EBITDA = Earnings Before Interest, Taxes, Depreciation and Amortization."},
  {cat:"valorisation", name:"EV/CA (EV/Sales)", formula:"Valeur d'entreprise / Chiffre d'affaires",
   def:"Valorise l'entreprise en multiple de son chiffre d'affaires.",
   use:"valoriser une entreprise quand l'EBITDA est négatif ou peu significatif, par exemple en forte croissance.",
   cours:"Multiple à manier avec précaution : il ne dit rien de la rentabilité, donc deux entreprises avec le même EV/CA peuvent avoir des niveaux de marge totalement différents.",
   exemple:"Valeur d'entreprise 1 200 k€, CA 2 000 k€ → multiple = 0,6x.",
   sigle:"EV = Enterprise Value (valeur d'entreprise)."},
  {cat:"valorisation", name:"PER", formula:"Cours de bourse / Bénéfice par action",
   def:"Nombre d'années de bénéfices que représente le prix payé pour une action.",
   use:"comparer la valorisation boursière au bénéfice généré, côté equity uniquement.",
   cours:"Un PER élevé peut refléter soit une survalorisation, soit de fortes attentes de croissance future des bénéfices — le contexte sectoriel et la croissance attendue sont indispensables pour l'interpréter correctement.",
   exemple:"Cours de bourse 30 €, BPA 2 € → PER = 15x.",
   sigle:"PER = Price Earning Ratio."},
  {cat:"valorisation", name:"Multiple d'entrée LBO", formula:"Valeur d'entreprise à l'acquisition / EBITDA",
   def:"Prix payé pour la cible au moment du montage, exprimé en multiple de son EBITDA.",
   use:"fixer le prix payé pour la cible au moment du montage, en multiple de son EBITDA.",
   cours:"Se négocie en croisant plusieurs méthodes de valorisation (comparables, DCF, transactions précédentes) : le multiple final résulte d'un compromis entre le prix visé par le vendeur et ce que la dette et l'equity du fonds peuvent financer tout en visant le TRI cible.",
   exemple:"Prix payé pour la cible 6 000 k€, EBITDA de la cible 1 000 k€ → multiple d'entrée = 6,0x.",
   sigle:"LBO = Leveraged Buy-Out (rachat avec effet de levier)."},
  {cat:"valorisation", name:"Levier financier LBO", formula:"Dette d'acquisition / EBITDA de la cible",
   def:"Part de l'acquisition financée par la dette, rapportée à l'EBITDA de la cible.",
   use:"évaluer le risque du montage et la marge de manœuvre pour rembourser la dette.",
   cours:"Plus le multiple d'entrée est élevé, plus il faut généralement mobiliser de dette pour limiter le ticket en capital du fonds — d'où l'importance de croiser ce ratio avec le dette nette/EBITDA de la cible pour vérifier la soutenabilité.",
   exemple:"Dette d'acquisition 3 600 k€, EBITDA de la cible 1 000 k€ → levier = 3,6x, soit 60 % du prix financé par dette (sur un multiple d'entrée de 6x).",
   sigle:"LBO = Leveraged Buy-Out (rachat avec effet de levier)."},
  {cat:"valorisation", name:"FCF Yield", formula:"Free Cash Flow / Valeur d'entreprise",
   def:"Rendement en cash généré par l'activité, rapporté au prix payé pour l'entreprise.",
   use:"vérifier que le prix payé est soutenu par une génération de cash réelle.",
   cours:"Un FCF Yield faible malgré un bon EV/EBITDA doit alerter : cela peut signifier que l'EBITDA se transforme mal en cash réel, par exemple à cause d'un BFR ou d'un capex très importants.",
   exemple:"FCF 100 k€, valeur d'entreprise 1 200 k€ → FCF yield = 8,3 %.",
   sigle:"FCF = Free Cash Flow (flux de trésorerie disponible)."},
  {cat:"valorisation", name:"TRI (taux de rendement interne)", formula:"Σ [Flux_t / (1 + TRI)^t] = 0",
   def:"Taux de rentabilité annualisé d'un investissement sur toute sa durée de détention.",
   use:"mesurer la performance annualisée d'un investissement sur toute sa durée de détention.",
   cours:"Contrairement au multiple de sortie (combien de fois la mise a été multipliée), le TRI intègre la dimension temporelle : un même multiple obtenu en 3 ans donne un TRI bien plus élevé qu'obtenu en 7 ans.",
   exemple:"Mise initiale 100, revente à 250 après 5 ans → TRI ≈ 20 % par an (2,5x en 5 ans)."},
  {cat:"valorisation", name:"Pay-back de la dette LBO", formula:"Dette d'acquisition / Cash-flow disponible moyen annuel",
   def:"Nombre d'années estimé pour désendetter totalement la holding d'acquisition.",
   use:"calibrer le montant de dette soutenable et anticiper la trajectoire de désendettement.",
   cours:"Directement lié au niveau de levier initial et à la capacité de génération de cash de la cible : plus le multiple d'entrée et la dette sont élevés, plus ce délai s'allonge, ce qui accroît le risque du montage.",
   exemple:"Dette d'acquisition 3 600 k€, cash-flow disponible moyen 600 k€/an → environ 6 ans pour se désendetter.",
   sigle:"LBO = Leveraged Buy-Out (rachat avec effet de levier)."},

  {cat:"rentabilite", name:"Marge de contribution", formula:"(CA – Coûts variables) / CA",
   def:"Part du chiffre d'affaires qui reste pour couvrir les charges fixes une fois les coûts variables payés.",
   use:"calculer le seuil de rentabilité (point mort) et juger la rentabilité différentielle d'un produit.",
   cours:"À ne pas confondre avec la marge brute : elle distingue coûts variables et coûts fixes (logique économique), alors que la marge brute distingue coûts directs et indirects (logique comptable) — les deux classifications ne se recoupent pas toujours parfaitement.",
   exemple:"CA 1 000 k€, coûts variables 600 k€ → marge de contribution = 40 %."},
  {cat:"rentabilite", name:"EBITDA ajusté (retraité)", formula:"EBITDA reporté ± retraitements des éléments non récurrents",
   def:"EBITDA corrigé des éléments exceptionnels ou non représentatifs de l'activité courante (litiges, indemnités, frais de management sortant...).",
   use:"donner une image fidèle de la rentabilité récurrente ; indispensable en due diligence.",
   cours:"Les retraitements doivent toujours être documentés et justifiés poste par poste : un EBITDA trop ajusté à la hausse est un signal d'alerte classique en due diligence, à challenger systématiquement côté acheteur.",
   exemple:"EBITDA reporté 180 k€ + 20 k€ de frais de management sortant non récurrents → EBITDA ajusté = 200 k€."},
  {cat:"rentabilite", name:"Effet de levier financier", formula:"ROE – ROA (spread lié à l'endettement)",
   def:"Écart entre la rentabilité pour les actionnaires et la rentabilité économique globale, dû à l'utilisation de la dette.",
   use:"juger si la dette amplifie ou dégrade la rentabilité pour les actionnaires.",
   cours:"Le levier devient dangereux dès que le coût de la dette dépasse la rentabilité économique (ROA) : dans ce cas, plus l'entreprise s'endette, plus elle détruit de la rentabilité pour ses actionnaires plutôt que d'en créer.",
   exemple:"ROE 20 % – ROA 8 % → effet de levier = +12 points : la dette amplifie ici la rentabilité pour les actionnaires."},
  {cat:"rentabilite", name:"CAF / CA", formula:"Capacité d'autofinancement / CA",
   def:"Part du chiffre d'affaires transformée en ressources internes disponibles pour rembourser des dettes, investir ou distribuer des dividendes.",
   use:"compléter l'EBITDA en intégrant la fiscalité et les éléments financiers réels.",
   cours:"Diffère de la marge d'EBITDA car elle intègre les charges et produits financiers réels ainsi que l'impôt effectivement payé — un indicateur plus proche du cash réellement généré par l'entreprise.",
   exemple:"CAF 220 k€, CA 1 000 k€ → CAF/CA = 22 %.",
   sigle:"CAF = Capacité d'AutoFinancement."},

  {cat:"solvabilite", name:"Net leverage (dette nette ajustée)", formula:"(Dette financière brute – Trésorerie disponible) / EBITDA",
   def:"Reprend le ratio dette/EBITDA mais net de la trésorerie disponible de l'entreprise.",
   use:"suivre le covenant bancaire le plus utilisé en LBO, trésorerie déduite.",
   cours:"L'écart entre leverage brut et net leverage peut être trompeur si la trésorerie de l'entreprise est en réalité difficile à mobiliser (logée à l'étranger, nantie en garantie...) — toujours vérifier la disponibilité réelle du cash avant de le déduire.",
   exemple:"Dette brute 900 k€, trésorerie 150 k€, EBITDA 250 k€ → net leverage = (900 – 150) / 250 = 3,0x."},
  {cat:"solvabilite", name:"TDSCR", formula:"CAF disponible / Service de toutes les tranches de dette (y compris subordonnée)",
   def:"Version élargie du DSCR qui intègre l'ensemble du service de la dette, y compris la dette mezzanine ou actionnaire.",
   use:"vérifier que les flux couvrent bien toutes les tranches de dette, senior comme subordonnée.",
   cours:"Particulièrement suivi dans les montages avec dette mezzanine ou dette d'actionnaire subordonnée, où le DSCR classique sur la seule dette senior donnerait une image trop optimiste de la capacité de remboursement globale.",
   exemple:"CAF disponible 220 k€, service de toutes les dettes (senior + mezzanine) 190 k€ → TDSCR = 1,16x.",
   sigle:"TDSCR = Total Debt Service Coverage Ratio (DSCR étendu à toutes les tranches de dette)."},
  {cat:"solvabilite", name:"Gearing ajusté (quasi-fonds propres)", formula:"Dette financière nette / (Capitaux propres + comptes courants d'associés bloqués)",
   def:"Variante du gearing qui réintègre les quasi-fonds propres, comme les comptes courants d'associés bloqués, dans les capitaux propres.",
   use:"éviter de surestimer l'endettement des PME françaises financées par comptes courants d'associés.",
   cours:"Fréquent dans les dossiers PME françaises où les associés ont avancé des fonds en compte courant : ce ratio évite de surestimer artificiellement l'endettement en traitant ces avances comme de la dette classique.",
   exemple:"Dette nette 600 k€, capitaux propres 300 k€ + comptes courants d'associés 200 k€ → gearing ajusté = 600 / 500 = 120 %, contre 200 % en gearing classique."},
  {cat:"solvabilite", name:"Ratio de financement propre des investissements", formula:"Capitaux propres / Immobilisations",
   def:"Mesure la part des investissements durables financée par les ressources propres plutôt que par la dette.",
   use:"évaluer l'équilibre financier à long terme, en complément du fonds de roulement.",
   cours:"Un ratio inférieur à 1 signifie que les immobilisations sont en partie financées par de la dette ou du BFR négatif, ce qui n'est pas anormal en soi mais doit rester cohérent avec la politique financière globale de l'entreprise.",
   exemple:"Capitaux propres 500 k€, immobilisations 650 k€ → ratio = 0,77 : une partie des immobilisations est financée par de la dette ou du BFR négatif."},
  {cat:"solvabilite", name:"Ratio de Cooke (prudentiel bancaire)", formula:"Fonds propres réglementaires / Actifs pondérés du risque (≥ 8 %)",
   def:"Ratio minimal de solvabilité imposé aux banques par les accords de Bâle, aujourd'hui remplacé par les ratios de solvabilité de Bâle III.",
   use:"comprendre la capacité des banques elles-mêmes à prêter, donc l'appétit au risque du marché.",
   cours:"Aujourd'hui largement remplacé dans la pratique par les ratios de Bâle III (CET1, Tier 1, ratio de levier), mais le principe reste identique : plus les actifs portés par la banque sont risqués, plus elle doit immobiliser de fonds propres en face.",
   exemple:"Fonds propres réglementaires 100, actifs pondérés du risque 1 000 → ratio = 10 %, au-dessus du minimum réglementaire de 8 %."},

  {cat:"activite", name:"Ratio de vétusté des immobilisations", formula:"Amortissements cumulés / Immobilisations brutes",
   def:"Indique la part de l'outil de production déjà amortie, donc son âge relatif.",
   use:"anticiper un mur d'investissements de renouvellement de l'outil productif.",
   cours:"Un ratio proche de 100 % peut annoncer un mur d'investissements à venir (renouvellement de l'outil productif), un point important à anticiper dans un modèle financier ou une due diligence industrielle.",
   exemple:"Amortissements cumulés 400 k€, immobilisations brutes 1 000 k€ → vétusté = 40 %."},

  {cat:"valorisation", name:"Capitalisation / CA (Price/Sales)", formula:"Capitalisation boursière / Chiffre d'affaires",
   def:"Valorise les seuls capitaux propres (capitalisation) en multiple du chiffre d'affaires, sans tenir compte de la dette.",
   use:"comparer des sociétés cotées à structures de capital différentes, dette exclue.",
   cours:"Contrairement à l'EV/CA, ce multiple ignore complètement la dette de l'entreprise : deux sociétés avec le même Capi/CA peuvent avoir des profils de risque financier totalement différents selon leur endettement.",
   exemple:"Capitalisation 1 500 k€, CA 2 000 k€ → multiple = 0,75x."},
  {cat:"valorisation", name:"Price to Book (P/B)", formula:"Capitalisation boursière / Capitaux propres comptables",
   def:"Compare la valorisation boursière à la valeur comptable des capitaux propres.",
   use:"repérer un écart entre valorisation boursière et actif net comptable, utile pour les activités à forts actifs tangibles.",
   cours:"Particulièrement pertinent pour les activités à actifs tangibles importants (banques, foncières, assurances) ; beaucoup moins parlant pour les entreprises à forte valeur immatérielle (marques, technologie, R&D) qui n'apparaît pas au bilan.",
   exemple:"Capitalisation 1 500 k€, capitaux propres comptables 1 000 k€ → P/B = 1,5x."},
  {cat:"valorisation", name:"Dividend yield", formula:"Dividende par action / Cours de l'action",
   def:"Rendement immédiat offert par le dividende versé, rapporté au prix de l'action.",
   use:"mesurer le rendement immédiat offert par le dividende, à ne pas confondre avec la performance totale.",
   cours:"Un rendement de dividende anormalement élevé peut aussi être un signal d'alerte plutôt qu'une bonne nouvelle : le marché anticipe parfois une baisse future du dividende, ce qui fait mécaniquement grimper le rendement affiché avant l'annonce.",
   exemple:"Dividende par action 1,5 €, cours 30 € → rendement = 5 %."},
  {cat:"valorisation", name:"BPA (bénéfice par action)", formula:"Résultat net / Nombre d'actions",
   def:"Part du résultat net qui revient à chaque action de l'entreprise.",
   use:"comparer la rentabilité par action dans le temps et servir de base au calcul du PER.",
   cours:"Attention à la dilution : une augmentation de capital ou l'exercice de stock-options augmente le nombre d'actions et peut faire baisser le BPA même si le résultat net progresse.",
   exemple:"Résultat net 300 k€, 150 000 actions → BPA = 2 €."},
  {cat:"valorisation", name:"Book value per share", formula:"Capitaux propres / Nombre d'actions",
   def:"Valeur comptable des capitaux propres rapportée à chaque action.",
   use:"évaluer un plancher de valorisation en cas de liquidation.",
   cours:"Repère utile mais imparfait : la valeur comptable des capitaux propres peut être très éloignée de la valeur de marché réelle des actifs, notamment en cas d'actifs sous-évalués (immobilier ancien) ou surévalués (goodwill important).",
   exemple:"Capitaux propres 1 000 k€, 150 000 actions → book value = 6,67 € par action."},

  {cat:"dcf", name:"WACC (coût moyen pondéré du capital)", formula:"(Coût des fonds propres × poids equity) + (Coût de la dette après IS × poids dette)",
   def:"Taux moyen pondéré exigé par l'ensemble des apporteurs de capitaux, actionnaires et créanciers, d'une entreprise.",
   use:"actualiser les flux futurs en DCF et fixer le seuil de création de valeur, à comparer au ROIC.",
   cours:"Le point le plus sensible du calcul est souvent le coût des fonds propres, qui dépend du bêta retenu (risque du secteur) et de la prime de risque de marché — deux hypothèses qui peuvent faire varier significativement la valorisation finale.",
   exemple:"Coût des fonds propres 12 % (70 % du financement), coût de la dette après IS 4 % (30 %) → WACC = 0,7×12 % + 0,3×4 % = 9,6 %.",
   sigle:"WACC = Weighted Average Cost of Capital."},
  {cat:"dcf", name:"Taux de croissance à l'infini (g)", formula:"Hypothèse de croissance perpétuelle des flux au-delà de l'horizon explicite",
   def:"Taux de croissance stabilisé retenu pour estimer la valeur terminale d'une entreprise, généralement proche de la croissance de long terme de l'économie.",
   use:"estimer la valeur terminale d'une entreprise au-delà de l'horizon explicite du DCF.",
   cours:"Règle de bon sens : g doit toujours rester inférieur au taux de croissance de long terme de l'économie (PIB), sinon l'entreprise finirait, dans le modèle, par devenir plus grande que l'économie entière.",
   exemple:"Si le PIB de long terme croît de 2 %, on retient souvent g entre 1,5 % et 2 % pour rester cohérent avec l'économie globale."},
  {cat:"dcf", name:"Prime de risque implicite", formula:"Rentabilité attendue du marché actions – Taux sans risque",
   def:"Rémunération supplémentaire exigée par les investisseurs pour détenir des actions plutôt qu'un actif sans risque.",
   use:"calculer le coût des fonds propres dans le WACC, via le MEDAF (CAPM).",
   cours:"Elle varie dans le temps selon l'aversion au risque des investisseurs : elle augmente en période de crise ou d'incertitude (ce qui fait mécaniquement baisser les valorisations via la hausse du WACC) et se resserre en période de confiance.",
   exemple:"Rentabilité attendue du marché actions 8 %, taux sans risque 3 % → prime de risque = 5 points.",
   sigle:"Souvent calculée via le MEDAF, appelé CAPM en anglais (Capital Asset Pricing Model)."},
  {cat:"rentabilite", name:"Croissance de l'EBITDA", formula:"(EBITDA n / EBITDA n-1) – 1, ou CAGR sur plusieurs exercices",

  {cat:"solvabilite", name:"Dette nette / position de trésorerie nette", formula:"Dette financière brute – Trésorerie et équivalents (positif = dette nette ; négatif = trésorerie nette)",

   cours:"Un ratio proche de 1 signale une société jeune ou qui distribue l'essentiel de ses bénéfices ; un ratio élevé traduit une accumulation de réserves dans le temps, typique d'une société mature qui capitalise ses résultats.",

  {cat:"solvabilite", name:"Covenant de levier net", formula:"Dette nette / EBITDA ≤ seuil contractuel fixé dans la documentation de crédit",

   cours:"Ne pas confondre avec le ratio de levier lui-même : le covenant est le SEUIL contractuel, pas le ratio observé. Le ratio observé se compare au covenant pour calculer la marge de sécurité (headroom).",

  {cat:"solvabilite", name:"Marge de sécurité levier vs seuil", formula:"Seuil contractuel (covenant) – Levier net observé",

  {cat:"solvabilite", name:"Equity cure", formula:"(Levier observé – Seuil du covenant) × EBITDA",
   def:"Mécanisme contractuel permettant aux actionnaires d'injecter du capital supplémentaire pour 'réparer' un covenant de levier sur le point d'être dépassé, en réduisant la dette nette ou en augmentant l'EBITDA pris en compte.",
   use:"permettre aux actionnaires de réparer un covenant de levier sur le point d'être dépassé.",
   cours:"Toujours vérifier les limites contractuelles : nombre maximum d'equity cures sur la durée du prêt (souvent 2 à 3), montant plafond, et si l'apport réduit la dette ou augmente l'EBITDA pro forma — les deux mécanismes existent selon les contrats.",
   exemple:"Levier observé 5,3x pour un covenant à 5,0x sur un EBITDA de 10 000 k€ → il faut injecter l'équivalent de 0,3x d'EBITDA, soit 3 000 k€, pour revenir dans les clous."},
  {cat:"solvabilite", name:"Réduction de la dette brute (%)", formula:"(Dette brute initiale – Dette brute actuelle) / Dette brute initiale",
   def:"Pourcentage de désendettement brut réalisé par l'entreprise depuis une date de référence, typiquement depuis la mise en place du financement (closing).",
   use:"suivre la trajectoire de désendettement d'un LBO dans le temps.",
   cours:"À ne pas confondre avec la réduction de la dette NETTE, qui peut évoluer différemment si la trésorerie varie en parallèle (une dette brute stable mais un cash qui augmente améliore aussi la dette nette sans réduire la dette brute).",
   exemple:"Dette brute initiale de 10 000 k€, dette brute actuelle de 7 500 k€ → réduction de la dette brute = 25 %."},
  {cat:"solvabilite", name:"Taux all-in par palier", formula:"Marge d'intérêt (variable selon le palier de levier) + taux de référence (Euribor/SOFR)",
   def:"Coût total du financement pour l'emprunteur à un moment donné, combinant le taux de référence du marché et la marge contractuelle applicable au palier de levier en vigueur.",
   use:"modéliser la charge d'intérêts réelle prévisionnelle à chaque niveau de la grille de marge.",
   cours:"Le taux all-in bouge pour deux raisons distinctes à ne pas confondre : la variation du taux de référence (marché, hors du contrôle de l'entreprise) et le changement de palier de marge (lié à la performance de désendettement de l'entreprise elle-même).",
   exemple:"Euribor 3 mois à 3,0 % + marge de 4,0 % au palier de levier actuel → taux all-in = 7,0 %.",
   sigle:"SOFR = Secured Overnight Financing Rate (taux de référence américain qui a remplacé le LIBOR)."},
  {cat:"solvabilite", name:"Trésorerie minimale", formula:"Trésorerie disponible ≥ seuil contractuel fixé (covenant de cash minimum)",
   def:"Engagement contractuel imposant à l'entreprise de conserver à tout moment un niveau minimum de trésorerie disponible sur ses comptes.",
   use:"protéger les prêteurs contre un risque de rupture de trésorerie soudaine.",
   cours:"Se rencontre surtout dans les financements à risque plus élevé (petites capitalisations, secteurs cycliques) où les prêteurs veulent un filet de sécurité opérationnel en plus des covenants financiers classiques.",
   exemple:"Covenant de trésorerie minimale fixé à 500 k€ ; l'entreprise dispose de 750 k€ de trésorerie disponible → covenant respecté avec 250 k€ de marge."},
  {cat:"solvabilite", name:"Investissements autorisés (% du BP annuel)", formula:"Capex autorisé = X % × Capex prévu au Business Plan",
   def:"Limite fixée par les prêteurs sur le montant d'investissements (capex) que l'entreprise peut engager chaque année, généralement calée sur le business plan présenté au moment du financement.",
   use:"encadrer la capacité de l'entreprise à réinvestir sans l'accord des prêteurs.",
   cours:"La plupart des documentations de crédit prévoient une tolérance (souvent 10 à 20 % au-dessus du BP) avant de nécessiter un accord express des prêteurs (waiver) pour des investissements supplémentaires.",
   exemple:"Capex prévu au BP de 2 000 k€ pour l'année, plafond contractuel à 120 % du BP → l'entreprise peut investir jusqu'à 2 400 k€ sans accord préalable des prêteurs.",
   sigle:"BP = Business Plan (plan d'affaires prévisionnel)."},
  {cat:"solvabilite", name:"Part du pool bancaire sécurisée", formula:"Montant de dette bénéficiant de sûretés / Montant total du pool bancaire",
   def:"Proportion de la dette totale du pool de prêteurs qui est adossée à des garanties réelles (nantissement d'actifs, de titres, hypothèques) plutôt que prêtée en blanc.",
   use:"déterminer le rang de priorité des créanciers en cas de défaillance.",
   cours:"À ne pas confondre avec le rang de séniorité (senior/subordonné) : une dette peut être senior sans être sécurisée par des sûretés spécifiques, et inversement.",
   exemple:"Pool bancaire total de 8 000 k€, dont 6 000 k€ adossés à un nantissement de titres → part sécurisée = 75 %."},
  {cat:"solvabilite", name:"Poids de la tranche dans le pool", formula:"Montant d'une tranche de dette (ex : TLB) / Montant total du pool bancaire",
   def:"Proportion que représente une ligne de financement spécifique (Term Loan A, Term Loan B, RCF, dette mezzanine...) dans l'ensemble de la dette levée pour l'opération.",
   use:"comprendre la structure du financement et identifier la tranche qui pèse le plus sur le service de la dette.",
   cours:"Une structure très concentrée sur une seule tranche (ex : 80 % en TLB) est plus simple à gérer administrativement mais concentre aussi le risque de refinancement sur un seul horizon de maturité, contrairement à une structure plus étagée.",
   exemple:"Pool bancaire total de 10 000 k€, dont 6 000 k€ de TLB → poids du TLB dans le pool = 60 %."},
  {cat:"dcf", name:"Valeur terminale / VE totale", formula:"Valeur terminale actualisée / Valeur d'entreprise totale du DCF",
   def:"Part que représente la valeur terminale dans la valorisation totale obtenue par la méthode DCF.",
   use:"juger la robustesse d'un DCF selon le poids des hypothèses de long terme dans la valorisation totale.",
   cours:"Un DCF où la valeur terminale représente plus de 80 % de la valeur totale doit être présenté avec précaution : il repose alors presque entièrement sur des hypothèses de long terme (g et WACC) plutôt que sur des flux réellement prévisibles.",
   exemple:"Valeur terminale actualisée 900 k€, VE totale du DCF 1 100 k€ → la valeur terminale représente 82 % de la valorisation, à challenger."}
];

const CATEGORIES = [
  {id:"rentabilite", label:"Rentabilité", color:"var(--mustard)"},
  {id:"liquidite", label:"Liquidité", color:"var(--teal)"},
  {id:"solvabilite", label:"Solvabilité", color:"var(--ink)"},
  {id:"activite", label:"Activité / BFR", color:"var(--rust)"},
  {id:"valorisation", label:"Valorisation", color:"var(--plum)"},
  {id:"dcf", label:"DCF", color:"var(--steel)"}
];
const catById = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));

const NO_FORMULA_QUESTION = new Set([
  "CAF / CA", "EV/EBITDA", "EV/CA (EV/Sales)", "Capitalisation / CA (Price/Sales)",
  "Dette nette / EBITDA", "Capitaux propres / capital social",
  "Taux de croissance à l'infini (g)", "Valeur terminale / VE totale"
]);

const NO_NAME_QUESTION = new Set([
  "Marge opérationnelle (EBIT)", "Couverture des intérêts", "DSO (délai clients)",
  "DPO (délai fournisseurs)", "Rotation des stocks (DIO)", "Taux de rotation de l'actif",
  "Ratio de vétusté des immobilisations", "Capitalisation / CA (Price/Sales)",
  "WACC (coût moyen pondéré du capital)", "Taux de croissance à l'infini (g)",
  "Prime de risque implicite", "Capitaux propres / capital social",
  "Ratio de levier R1 (grille TLA/TLB/RCF)", "Marge de sécurité levier vs seuil",
  "Réduction de la dette brute (%)", "Taux all-in par palier",
  "Part du pool bancaire sécurisée", "Poids de la tranche dans le pool",
  "Valeur terminale / VE totale"
]);

const SHORT_NAME_OVERRIDES = {
  "Gearing (dette nette / fonds propres)": "Gearing",
  "Gearing ajusté (quasi-fonds propres)": "Gearing ajusté"
};
function shortName(r){ return SHORT_NAME_OVERRIDES[r.name] || r.name; }
function utilAnswer(u){ return "À " + u; }

const QUESTION_TYPES = [
  {id:"formula", label:"formule", key:"formula", scoreField:"formula",
   ask:r => Math.random()<0.5
     ? `Quelle est la formule de « ${shortName(r)} » ?`
     : `Comment calcule-t-on le ratio ${shortName(r)} ?`},
  {id:"use", label:"utilité", key:"use", scoreField:"use",
   ask:r => `À quoi sert principalement le ratio « ${r.name} » ?`},
  {id:"name", label:"identification", key:"name", scoreField:"formula",
   ask:r => `Quel ratio correspond à la formule suivante ?<br><span class="target">${r.formula}</span>`},
  {id:"indicateur", label:"indicateur", key:"name", scoreField:"use",
   ask:r => `Quel indicateur permet de ${r.use} ?`}
];

/* ---------------- state (persisted) ---------------- */
const STORAGE_KEY = "ratios-quiz-qcm-v1";
let weights = {};
let batch = {answered:0, correct:0};
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  weights = saved.weights || {};
  batch = saved.batch || batch;
}catch(e){}
RATIOS.forEach(r=>{ if(!(r.name in weights)) weights[r.name]=3; });

let activeCat = null;
let current = null;      // ratio at the heart of the question
let qtype = null;
let lastName = null;
let answered = false;

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({weights, batch}));
}

/* ---------------- pool / draw ---------------- */
function pool(){
  return activeCat ? RATIOS.filter(r=>r.cat===activeCat) : RATIOS;
}
function pickTarget(){
  const p = pool().filter(r=>r.name!==lastName || pool().length===1);
  const total = p.reduce((s,r)=>s+weights[r.name],0);
  let x = Math.random()*total;
  for(const r of p){
    x -= weights[r.name];
    if(x<=0) return r;
  }
  return p[p.length-1];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const STOPWORDS = new Set(["ratio","cette","avec","pour","dans","plus","comme","aussi","donc","ainsi",
  "selon","chaque","toute","tous","toutes","peut","doit","dont","leurs","leur","elle","elles","sont",
  "être","avoir","fait","faire","entre","permet","cette","celle","celui","ceux","très","aux","des","les",
  "une","dune","dun","dans","sans","plutôt","souvent","quand","lorsque","alors","donné","donnée"]);

function tokenize(s){
  return (s||"")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/)
    .filter(w => w.length>=4 && !STOPWORDS.has(w));
}

function pickDistractors(correct, key, scoreField, n){
  const candidates = RATIOS.filter(r=>r!==correct);
  const correctTokens = new Set(tokenize(correct[scoreField]));
  const seen = new Set([correct[key]]);

  const scored = candidates.map(r=>{
    const tks = tokenize(r[scoreField]);
    let overlap = 0;
    tks.forEach(t=>{ if(correctTokens.has(t)) overlap++; });
    return {r, overlap, rand:Math.random()};
  });
  scored.sort((a,b)=> b.overlap - a.overlap || a.rand - b.rand);

  const out = [];
  for(const {r} of scored){
    if(out.length>=n) break;
    const val = r[key];
    if(!seen.has(val)){ seen.add(val); out.push(val); }
  }
  return out;
}

/* ---------------- render ---------------- */
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const btnNext = document.getElementById("btnNext");

function setCatColor(catId){
  document.documentElement.style.setProperty("--cat-color", catById[catId].color);
}

let correctText = null;

function renderQuestion(){
  answered = false;
  const r = pickTarget();
  lastName = r.name;
  current = r;

  const availableTypes = QUESTION_TYPES.filter(t=>{
    if(t.id === "formula" && NO_FORMULA_QUESTION.has(r.name)) return false;
    if(t.id === "name" && NO_NAME_QUESTION.has(r.name)) return false;
    return true;
  });
  qtype = availableTypes[Math.floor(Math.random()*availableTypes.length)];

  setCatColor(r.cat);
  document.getElementById("catTag").textContent = catById[r.cat].label;
  document.getElementById("qtype").textContent = "question — " + qtype.label;
  document.getElementById("question").innerHTML = qtype.ask(r);

  correctText = r[qtype.key];
  let distractors = pickDistractors(r, qtype.key, qtype.scoreField, 3);
  if(qtype.id === "use"){
    correctText = utilAnswer(correctText);
    distractors = distractors.map(utilAnswer);
  }
  const opts = shuffle([correctText, ...distractors]);
  const letters = ["A","B","C","D"];

  optionsEl.innerHTML = "";
  opts.forEach((text, i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">${letters[i]}</span>${text}`;
    b.dataset.correct = (text===correctText) ? "1" : "0";
    b.onclick = ()=>selectAnswer(b);
    optionsEl.appendChild(b);
  });

  feedbackEl.classList.remove("show");
  btnNext.hidden = true;
}

function selectAnswer(btn){
  if(answered) return;
  answered = true;
  const knew = btn.dataset.correct==="1";

  [...optionsEl.children].forEach(o=>{
    o.disabled = true;
    if(o.dataset.correct==="1") o.classList.add("correct");
    else if(o===btn) o.classList.add("wrong");
    else o.classList.add("dim");
  });

  const w = weights[current.name];
  batch.answered++;
  if(knew){
    weights[current.name] = Math.max(1, w-1);
    batch.correct++;
  }else{
    weights[current.name] = Math.min(12, w+3);
  }

  let hitMilestone = false;
  let milestonePct = 0, milestoneCorrect = 0;
  if(batch.answered >= 100){
    hitMilestone = true;
    milestonePct = Math.round((batch.correct / batch.answered) * 100);
    milestoneCorrect = batch.correct;
    batch.answered = 0;
    batch.correct = 0;
  }
  persist();
  updateBatchDisplay();

  document.getElementById("verdict").textContent = knew ? "✓ exact." : "✗ pas tout à fait — à revoir.";
  document.getElementById("verdict").className = "verdict " + (knew?"ok":"ko");

  const briefBlock = document.getElementById("briefBlock");
  const miniCours = document.getElementById("miniCours");

  if(knew){
    document.getElementById("formulaLine").textContent = current.formula;
    document.getElementById("explDef").textContent = current.def;
    document.getElementById("explUse").textContent = current.use;
    briefBlock.hidden = false;
    miniCours.classList.remove("show");
  }else{
    document.getElementById("mcSigle").textContent = current.sigle || "";
    document.getElementById("mcDef").textContent = current.def;
    document.getElementById("mcFormula").textContent = current.formula;
    document.getElementById("mcUse").textContent = current.use;
    document.getElementById("mcTip").textContent = current.cours;
    document.getElementById("mcExemple").textContent = current.exemple || "—";
    briefBlock.hidden = true;
    miniCours.classList.add("show");
  }

  feedbackEl.classList.add("show");
  btnNext.hidden = false;

  if(hitMilestone){
    showScorePopup(milestonePct, milestoneCorrect);
  }
}

function updateBatchDisplay(){
  const pct = batch.answered ? Math.round((batch.correct/batch.answered)*100) : 0;
  document.getElementById("scorePct").textContent = pct + "%";
}

function showScorePopup(pct, correctCount){
  document.getElementById("popupScore").textContent = pct + "%";
  document.getElementById("popupSub").textContent = correctCount + " bonnes réponses sur 100";
  document.getElementById("popupOverlay").classList.add("show");
}

/* ---------------- rail ---------------- */
const railEl = document.getElementById("rail");
function buildRail(){
  railEl.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.textContent = "Tout";
  allBtn.className = "all" + (activeCat===null ? " active":"");
  allBtn.style.setProperty("--cat-color","var(--ink)");
  allBtn.onclick = ()=>{ activeCat=null; buildRail(); renderQuestion(); };
  railEl.appendChild(allBtn);

  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c.label;
    b.style.setProperty("--cat-color", c.color);
    if(activeCat===c.id) b.classList.add("active");
    b.onclick = ()=>{ activeCat = (activeCat===c.id) ? null : c.id; buildRail(); renderQuestion(); };
    railEl.appendChild(b);
  });
}

/* ---------------- events ---------------- */
btnNext.addEventListener("click", renderQuestion);
document.getElementById("popupClose").addEventListener("click", ()=>{
  document.getElementById("popupOverlay").classList.remove("show");
});

document.addEventListener("keydown", (e)=>{
  if(!answered && ["1","2","3","4"].includes(e.key)){
    const idx = parseInt(e.key,10)-1;
    const btn = optionsEl.children[idx];
    if(btn) selectAnswer(btn);
  } else if(answered && (e.code==="Enter" || e.code==="Space")){
    e.preventDefault();
    renderQuestion();
  }
});

/* ---------------- init ---------------- */
buildRail();
updateBatchDisplay();
renderQuestion();

/* ---------------- offline (PWA) ---------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
